name: Release

# 版本标签 v* → 测包、构建 wheel、创建本项目 GitHub Release，再触发 main → develop 同步。
# 不向上游占用的 octop PyPI 包名发布此分叉版本；GHCR 镜像由 docker-publish.yml 并行发布。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

      - name: Build package
        run: make build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        run: |
          version=${{ steps.version.outputs.version }}
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[?$version\]?/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md > .release-notes.md || true
          fi
          if [ ! -s .release-notes.md ]; then
            PREV=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
            {
              echo "## What's changed"
              echo ""
              if [ -n "$PREV" ]; then
                git log "${PREV}..${GITHUB_REF_NAME}" --oneline --no-decorate
              else
                git log --oneline --no-decorate | head -20
              fi
              echo ""
              echo "## Install from this repository"
              echo ""
              echo "Download the wheel from https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}, or update an existing source checkout."
              echo "Do not install the upstream octop PyPI package."
            } > .release-notes.md
          fi
          if ! grep -q '^## Downloads' .release-notes.md; then
            python3 scripts/release_download_links.py "$version" >> .release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .release-notes.md
          files: dist/*
          generate_release_notes: true

  # workflow_run / release:published are unreliable when Release itself was
  # started via GITHUB_TOKEN workflow_dispatch (Auto Tag). Explicitly cascade.
  #
  # This job intentionally has no checkout: pass --repo so `gh` does not need a
  # local .git (bare runner → "fatal: not a git repository"). Dispatch failure
  # must fail this workflow so a missed sync is visible.
  sync-develop:
    name: Trigger sync main into develop
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Sync Main Into Develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sync-main-to-develop.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f version="${{ github.ref_name }}"

