services:
  maitu:
    image: ghcr.io/tencentcloud/octop:latest
    container_name: maitu
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8088:8088"
    volumes:
      - "/var/apps/octop/share/octop/data:/data/.maitu"
    environment:
      - HOME=/data
      - MAITU_BIND_HOST=0.0.0.0
      - MAITU_PORT=${MAITU_PORT:-8088}
      - MAITU_LOG_LEVEL=${MAITU_LOG_LEVEL:-info}
      - MAITU_DEFAULT_PASSWORD=${MAITU_DEFAULT_PASSWORD:-}
      - MAITU_ADMIN_USERNAME=${MAITU_ADMIN_USERNAME:-admin}
      - MAITU_ADMIN_DISPLAY_NAME=${MAITU_ADMIN_DISPLAY_NAME:-Admin}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
