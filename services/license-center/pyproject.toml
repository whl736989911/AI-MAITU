[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "maitu-license-center"
version = "1.0.0"
description = "Standalone instance authorization center"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "PyJWT[crypto]>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "pyotp>=2.9,<3",
  "cryptography>=43,<46",
  "typer>=0.12,<1",
]

[project.scripts]
license-center = "license_center.cli:app"

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["license_center"]

[tool.hatch.build]
include = ["license_center/**/*.py", "license_center/migrations/*.sql", "license_center/dashboard/**"]
artifacts = ["license_center/dashboard/**"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"license_center/api.py" = ["B008"]
