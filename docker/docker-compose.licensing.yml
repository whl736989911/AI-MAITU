# Merge with docker-compose.yml; provision public trust before launching.
# docker compose -f docker/docker-compose.yml -f docker/docker-compose.licensing.yml up -d
services:
  maitu:
    environment:
      OCTOP_LICENSE_SERVER_URL: ${OCTOP_LICENSE_SERVER_URL:?Set the HTTPS authorization center URL}
      OCTOP_LICENSE_TRUST_FILE: /etc/maitu/license/trusted-keys.json
      OCTOP_LICENSE_CA_FILE: ${OCTOP_LICENSE_CA_FILE:-}
      OCTOP_LICENSE_CONTACT: ${OCTOP_LICENSE_CONTACT:-}
    volumes:
      - type: bind
        source: ${OCTOP_LICENSE_TRUST_DIR:?Set the operator-managed public trust directory}
        target: /etc/maitu/license
        read_only: true
